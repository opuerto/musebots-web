<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Drum kit">
  <!-- crash cymbal and stand -->
  <path d="M162 76 L162 150" stroke="#9aa3ad" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="160" cy="62" rx="32" ry="7" transform="rotate(-10 160 62)" fill="#e8b93b" stroke="#946b0e" stroke-width="3"/>
  <circle cx="160" cy="62" r="3" fill="#946b0e"/>
  <!-- hi-hat -->
  <path d="M34 82 L34 150" stroke="#9aa3ad" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="34" cy="76" rx="24" ry="5.5" fill="#e8b93b" stroke="#946b0e" stroke-width="3"/>
  <ellipse cx="34" cy="84" rx="24" ry="5.5" fill="#d9a82c" stroke="#946b0e" stroke-width="3"/>
  <!-- bass drum -->
  <circle cx="100" cy="128" r="46" fill="#9c2a20" stroke="#5e130c" stroke-width="5"/>
  <circle cx="100" cy="128" r="36" fill="#f3efe7" stroke="#c7c0b2" stroke-width="3"/>
  <circle cx="100" cy="128" r="6" fill="#9c2a20"/>
  <!-- rack tom -->
  <rect x="72" y="66" width="56" height="26" rx="4" fill="#9c2a20" stroke="#5e130c" stroke-width="4"/>
  <ellipse cx="100" cy="66" rx="28" ry="7" fill="#f3efe7" stroke="#c7c0b2" stroke-width="3"/>
  <!-- snare -->
  <rect x="50" y="116" width="0" height="0"/>
  <path d="M26 150 L26 176 M60 150 L60 176" stroke="#9aa3ad" stroke-width="4" stroke-linecap="round"/>
  <rect x="12" y="136" width="62" height="18" rx="4" fill="#cfd5dc" stroke="#7c8793" stroke-width="3"/>
  <ellipse cx="43" cy="136" rx="31" ry="6.5" fill="#f3efe7" stroke="#c7c0b2" stroke-width="3"/>
  <!-- sticks -->
  <path d="M122 28 L96 62" stroke="#d8b384" stroke-width="5" stroke-linecap="round"/>
  <path d="M138 36 L106 66" stroke="#c49e6c" stroke-width="5" stroke-linecap="round"/>
</svg>
